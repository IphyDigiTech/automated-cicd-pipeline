
name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      # Diagnostic step: inspect GitHub OIDC claims before AWS authentication.
      # This prints only the issuer, audience and subject, never the token.
      - name: Diagnose GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          export OIDC_RESPONSE

          python - <<'PY'
          import os
          import json
          import base64

          token = json.loads(os.environ["OIDC_RESPONSE"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC Issuer:", claims.get("iss"))
          print("OIDC Audience:", claims.get("aud"))
          print("OIDC Subject:", claims.get("sub"))
          PY

      # Authenticate to AWS using GitHub's temporary OIDC credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::282203650631:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build once and push the image to both Docker Hub and Amazon ECR.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:${{ github.sha }}
            282203650631.dkr.ecr.us-east-1.amazonaws.com/flask-cicd-app:latest
            282203650631.dkr.ecr.us-east-1.amazonaws.com/flask-cicd-app:${{ github.sha }}
